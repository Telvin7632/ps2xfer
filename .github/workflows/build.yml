name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ps2:
    name: PS2 build (ps2dev/ps2dev:latest)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    defaults:
      run:
        shell: bash # GitHub runs it with -eo pipefail, so "make | tee" fails on errors
    steps:
      - name: Install build tools
        shell: sh
        run: apk add --no-cache build-base bash curl unzip git zip

      - uses: actions/checkout@v5

      - name: Build
        run: make 2>&1 | tee build.log

      - name: No compiler warnings
        run: "! grep -i 'warning:' build.log"

      - name: No unresolved symbols in the IRX
        run: |
          if mipsel-none-elf-nm iop/ps2xfer.notiopmod.elf | grep ' U '; then
            echo "unresolved symbols in ps2xfer.irx"; exit 1
          fi

      - name: Release archive
        run: make dist

      - uses: actions/upload-artifact@v5
        with:
          name: ps2xfer
          path: dist/ps2xfer.zip
          if-no-files-found: error

  host-tests:
    name: Simulator + client end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install exfatprogs
        run: sudo apt-get update && sudo apt-get install -y exfatprogs

      - name: make test
        run: make test

  windows:
    name: Windows .exe (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ps2xfer-gui.exe (window) and ps2xfer.exe (command line)
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name ps2xfer-gui --icon pc/ps2xfer.ico pc/ps2xfer.py
          pyinstaller --onefile --console --name ps2xfer --icon pc/ps2xfer.ico pc/ps2xfer.py

      - name: Smoke test
        run: dist\ps2xfer.exe --help

      - uses: actions/upload-artifact@v5
        with:
          name: ps2xfer-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: GitHub release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ps2, windows, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package
        run: |
          set -e
          mkdir pkg
          cd pkg
          unzip -q ../artifacts/ps2xfer/ps2xfer.zip
          cp ../artifacts/ps2xfer-windows/*.exe ps2xfer/
          zip -qr "../ps2xfer-${GITHUB_REF_NAME}.zip" ps2xfer
          ls -la ps2xfer

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "ps2xfer-${GITHUB_REF_NAME}.zip"
          --repo "$GITHUB_REPOSITORY" --title "ps2xfer $GITHUB_REF_NAME" --generate-notes
